{% extends "base.html" %}
{% block title %}Регистрация | Pochatox{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center">
    <div class="card shadow-lg p-5" style="max-width:540px; width:100%; background-color:#232834;
                border:1px solid #3a4154; border-radius:1rem;">

        <h4 class="text-center mb-4" style="color:#e6e9ef;">Создание аккаунта</h4>

        <form method="post" id="registerForm" novalidate>
            <div class="text-center mb-4">
                <div class="position-relative d-inline-block">
                    <img id="selectedAvatarPreview" src="" data-bs-toggle="modal" data-bs-target="#avatarModal" style="width:96px; height:96px; object-fit:cover;
                            border-radius:20%; border:3px solid #5a66a0;
                            cursor:pointer; transition:0.2s;">
                </div>
                <input type="hidden" name="avatar" id="selectedAvatarInput" value="">
                <div style="color:#9aa4b2; font-size:0.85rem;" class="mt-2">
                    Нажмите, чтобы выбрать аватар
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstName" style="color:#cfd6e4;">Имя</label>
                    <input type="text" name="first_name" id="firstName" class="form-control"
                        style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268; padding:0.6rem;"
                        required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="lastName" style="color:#cfd6e4;">Фамилия</label>
                    <input type="text" name="last_name" id="lastName" class="form-control"
                        style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268; padding:0.6rem;"
                        required>
                </div>
            </div>

            <div class="mb-3 position-relative">
                <label for="username" style="color:#cfd6e4;">Username</label>
                <div style="position:relative;">
                    <span style="position:absolute; left:0.75rem; top:50%; transform:translateY(-50%);
                     color:#9aa4b2; font-size:1rem; line-height:1;">@</span>
                    <input type="text" name="username" id="username" class="form-control" style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268;
                                  padding:0.6rem 0.75rem 0.6rem 2rem; height:calc(1.5em + 1.2rem);" minlength="2"
                        pattern="[A-Za-z0-9_]+" title="Только английские буквы, цифры и _" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" style="color:#cfd6e4;">Email</label>
                <input type="email" name="email" id="email" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268; padding:0.6rem;" required>
            </div>

            <div class="mb-3">
                <label for="password" style="color:#cfd6e4;">Пароль</label>
                <input type="password" name="password" id="password" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268; padding:0.6rem;"
                    pattern="[A-Za-z0-9!@#$%^&*()_+=-]{5,74}"
                    title="Только английские буквы, цифры и символы !@#$%^&*()_+=-, от 5 до 74 символов" minlength="5"
                    maxlength="74" required>
            </div>

            <div class="mb-2">
                <label for="passwordRepeat" style="color:#cfd6e4;">Повторите пароль</label>
                <input type="password" name="password_repeat" id="passwordRepeat" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268; padding:0.6rem;"
                    pattern="[A-Za-z0-9!@#$%^&*()_+=-]+" required>
                <div id="passwordError" style="color:#f2a8a8; font-size:0.8rem; display:none; margin-top:4px;">
                    Пароли не совпадают
                </div>
            </div>

            <button type="submit" class="w-100 mt-3" style="background-color:#5a66a0; color:#e6e9ef; border:none; border-radius:0.6rem;
                           padding:0.6rem 0; font-weight:500; transition:0.2s;">
                Создать аккаунт
            </button>
        </form>
    </div>
</div>

<div class="modal fade" id="avatarModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="background-color:#232834; border:1px solid #3a4154;">
            <div class="modal-header border-0">
                <h5 class="modal-title" style="color:#e6e9ef;">Выберите аватар</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    {% for avatar in avatars %}
                    <div class="col-3 text-center">
                        <img src="/static/avatars/{{ avatar }}" class="avatar-option" data-avatar="{{ avatar }}" style="width:84px; height:84px; object-fit:cover; border-radius:20%;
                                    cursor:pointer; border:2px solid transparent; transition:0.2s;">
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const avatars = [{% for a in avatars %}'{{ a }}'{% if not loop.last %}, {% endif %} {% endfor %}];
    const avatarInput = document.getElementById('selectedAvatarInput');
    const avatarPreview = document.getElementById('selectedAvatarPreview');

    function setRandomAvatar() {
        const randomAvatar = avatars[Math.floor(Math.random() * avatars.length)];
        avatarInput.value = randomAvatar;
        avatarPreview.src = '/static/avatars/' + randomAvatar;
    }
    setRandomAvatar();

    document.querySelectorAll('.avatar-option').forEach(img => {
        img.addEventListener('click', () => {
            avatarInput.value = img.dataset.avatar;
            avatarPreview.src = '/static/avatars/' + img.dataset.avatar;
            const modal = bootstrap.Modal.getInstance(document.getElementById('avatarModal'));
            modal.hide();
        });
    });

    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const repeat = document.getElementById('passwordRepeat');
    const passwordError = document.getElementById('passwordError');

    function validatePasswordsAndUsername() {
        let valid = true;

        if (password.value.length < 5) {
            passwordError.style.display = 'block';
            passwordError.textContent = `Пароль должен быть не менее ${password_min_length} символов`;
            password.style.borderColor = '#f2a8a8';
            valid = false;
        } else if (password.value.length > 74) {
            passwordError.style.display = 'block';
            passwordError.textContent = `Пароль не должен превышать ${password_max_length} символов`;
            password.style.borderColor = '#f2a8a8';
            valid = false;
        } else if (password.value !== repeat.value) {
            passwordError.style.display = 'block';
            passwordError.textContent = 'Пароли не совпадают';
            repeat.style.borderColor = '#f2a8a8';
            password.style.borderColor = '#f2a8a8';
            valid = false;
        } else {
            passwordError.style.display = 'none';
            repeat.style.borderColor = '#4a5268';
            password.style.borderColor = '#4a5268';
        }

        if (username.value.length < 2 || username.value.length > 12) {
            username.style.borderColor = '#f2a8a8';
            valid = false;
        } else {
            username.style.borderColor = '#4a5268';
        }

        return valid;
    }

    form.addEventListener('submit', e => {
        if (!form.checkValidity()) {
            e.preventDefault();
            form.reportValidity();
            return;
        }
        if (!validatePasswords()) e.preventDefault();
    });
</script>
{% endblock %}
