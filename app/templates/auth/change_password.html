{% extends "base.html" %}

{% block title %}Смена пароля | Pochatox{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card p-4 shadow"
        style="width: 420px; background-color:#232834; border:1px solid #3a4154; border-radius:0.9rem;">
        <h4 class="mb-4 text-center" style="color:#e6e9ef;">Смена пароля</h4>

        <form method="post">
            <div class="mb-3">
                <label class="form-label" style="color:#cfd6e4;">Текущий пароль</label>
                <input type="password" name="current_password" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268;" required>
            </div>

            <div class="mb-3">
                <label class="form-label" style="color:#cfd6e4;">Новый пароль</label>
                <input type="password" name="new_password" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268;" required>
            </div>

            <div class="mb-3">
                <label class="form-label" style="color:#cfd6e4;">Повторите пароль</label>
                <input type="password" name="confirm_password" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268;" required>
            </div>

            <button type="submit" class="w-100"
                style="background-color:#5a66a0; color:#e6e9ef; border:none; border-radius:0.5rem; padding:0.5rem 0; font-weight:500;">
                Обновить пароль
            </button>
        </form>
        {% if error %}
        <div class="alert alert-danger mt-2" style="background-color:#3a4154; color:#f2a8a8; border:none;">
            {{ error.detail if error.detail else 'Ошибка' }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
