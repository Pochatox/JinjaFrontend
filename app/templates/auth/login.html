{% extends "base.html" %}

{% block title %}Вход | Pochatox{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card p-4 shadow"
        style="width: 380px; background-color:#232834; border:1px solid #3a4154; border-radius:0.9rem;">
        <h4 class="mb-4 text-center" style="color:#e6e9ef;">Авторизация</h4>

        <form method="post">
            <div class="mb-3">
                <label class="form-label" style="color:#cfd6e4;">Username</label>
                <input type="text" name="username" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268;" required>
            </div>

            <div class="mb-3">
                <label class="form-label" style="color:#cfd6e4;">Пароль</label>
                <input type="password" name="password" class="form-control"
                    style="background-color:#2a2f3f; color:#e6e9ef; border:1px solid #4a5268;" required>
            </div>

            <button type="submit" class="w-100"
                style="background-color:#5a66a0; color:#e6e9ef; border:none; border-radius:0.5rem; padding:0.5rem 0; font-weight:500;">
                Войти
            </button>
        </form>
        {% if error %}
        <div class="alert alert-danger mt-2" style="background-color:#3a4154; color:#f2a8a8; border:none;">
            {{ error if error else 'Ошибка' }}
        </div>
        {% endif %}

        <div class="text-center mt-3">
            <a href="/auth/registration" style="color:#9aa4b2; font-size:0.875rem;">Нет аккаунта?</a>
        </div>
    </div>
</div>
{% endblock %}
