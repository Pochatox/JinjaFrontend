<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Pochatox{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/pochatox.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg px-4">
        <a class="navbar-brand fw-semibold" href="/">Pochatox</a>

        <div class="collapse navbar-collapse">
            <div class="ms-auto dropdown">
                <a href="#" class="nav-link dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                    <span id="nav-user-text">
                        <span class="text-secondary">Войдите или создайте аккаунт</span>
                    </span>
                    <div id="nav-avatar" class="spinner-border spinner-border-sm" role="status"></div>
                </a>

                <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                    <li><a class="dropdown-item" href="/user/me">Профиль</a></li>
                    <li><a class="dropdown-item" href="/">Проекты</a></li>
                    <li><a class="dropdown-item text-danger" href="/auth/logout-request">Выход</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% block content %} {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadUser() {
            const stored = localStorage.getItem("user");
            if (stored) {
                renderUser(JSON.parse(stored));
                return;
            }

            try {
                const r = await fetch("/me-short", { credentials: "include" });
                if (!r.ok) return;

                const user = await r.json();
                if (user == null) return;
                localStorage.setItem("user", JSON.stringify(user));
                renderUser(user);
            } catch { }
        }

        function renderUser(user) {
            const avatar = document.getElementById("nav-avatar");
            avatar.outerHTML = `<img id="nav-avatar" src="/static/avatars/${user.avatar}" width="28" height="28" style="border-radius:20%; border:1px solid #4a5268; object-fit:cover;">`;

            const text = document.getElementById("nav-user-text");
            text.innerHTML = `<span class="text-secondary">(${user.first_name} ${user.last_name})</span> <span class="fw-semibold">@${user.username}</span>`;
        }

        loadUser();
    </script>
</body>

</html>
